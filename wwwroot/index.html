<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deadlock Store</title><style>body{font-family:Arial;max-width:900px;margin:2rem auto;padding:0 1rem}section{border:1px solid #ddd;border-radius:8px;padding:1rem;margin-bottom:1rem}input,select,button{padding:.55rem;margin:.25rem}button{cursor:pointer}#message{color:#b00020}</style></head><body>
<h1>Gestión de órdenes</h1><p id="message"></p>
<section><h2>Registrar cliente</h2><form id="clientForm"><input id="clientName" placeholder="Nombre" required><input id="clientEmail" type="email" placeholder="Email" required><button>Guardar</button></form></section>
<section><h2>Crear orden</h2><form id="orderForm"><select id="clientId" required></select><div id="products"></div><button>Crear orden</button></form></section>
<section><h2>Factura</h2><input id="orderId" type="number" min="1" placeholder="Id de orden"><button id="invoiceButton">Generar factura</button><pre id="invoice"></pre></section>
<script>
const $=id=>document.getElementById(id), msg=$('message');
async function req(url,opt){const r=await fetch(url,opt);if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function load(){const [cs,ps]=await Promise.all([req('/api/clientes'),req('/api/productos')]);$('clientId').innerHTML=cs.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('products').innerHTML=ps.map(x=>`<label><input type="number" min="0" max="${x.stock}" data-product="${x.id}" placeholder="0"> ${x.name} ($${x.price}) stock: ${x.stock}</label><br>`).join('')}
$('clientForm').onsubmit=async e=>{e.preventDefault();try{await req('/api/clientes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('clientName').value,email:$('clientEmail').value})});e.target.reset();await load();msg.textContent='Cliente guardado'}catch(x){msg.textContent=x.message}}
$('orderForm').onsubmit=async e=>{e.preventDefault();const items=[...document.querySelectorAll('[data-product]')].filter(x=>+x.value>0).map(x=>({productoId:+x.dataset.product,cantidad:+x.value}));if(items.length < 2){msg.textContent='Selecciona al menos dos productos diferentes.';return}try{const o=await req('/api/ordenes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clienteId:+$('clientId').value,items})});$('orderId').value=o.id;msg.textContent=`Orden creada: ${o.id}`;await load()}catch(x){msg.textContent=x.message}}
$('invoiceButton').onclick=async()=>{try{$('invoice').textContent=JSON.stringify(await req(`/api/ordenes/${$('orderId').value}/factura`,{method:'POST'}),null,2)}catch(x){msg.textContent=x.message}}
load().catch(x=>msg.textContent=x.message);
</script></body></html>
